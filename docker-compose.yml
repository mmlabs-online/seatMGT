# On-prem: run as-is with `docker compose up --build`. For cloud, point
# DATABASE_URL (in .env) at a managed Postgres instance and drop the local
# `postgres` service below.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatmap
      POSTGRES_PASSWORD: seatmap
      POSTGRES_DB: seatmap
    ports:
      - "5432:5432"
    volumes:
      - seatmap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatmap -d seatmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides .env's localhost URL — inside compose's network, Postgres
      # is reachable at the service name, not localhost.
      DATABASE_URL: "postgresql://seatmap:seatmap@postgres:5432/seatmap"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  seatmap-postgres-data:
